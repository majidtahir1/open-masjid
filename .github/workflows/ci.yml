name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs for the same branch when a new commit is pushed.
# Saves CI minutes and gets you faster signal on the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate (~1 min): typecheck + unit tests in parallel with the build.
  test:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[fast-ship]')) }}
    name: Type check + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Heavier gate (~3-5 min cold, ~1-2 min warm): runs the same `next build`
  # the prod Dockerfile runs. Catches strict-TS overlap errors that tsc
  # alone misses (Next regenerates Payload types). Caching .next/cache cuts
  # repeat builds to ~half the cold time.
  build:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[fast-ship]')) }}
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Build
        env:
          # Stub env vars so the build doesn't crash on missing config.
          # Build is type-only; values don't need to be valid at runtime.
          DATABASE_URI: postgres://stub:stub@localhost:5432/stub
          PAYLOAD_SECRET: ci-stub-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: https://example.com
          STRIPE_SECRET_KEY: sk_test_stub
          STRIPE_WEBHOOK_SECRET: whsec_stub
          STRIPE_PRICE_MONTHLY: price_stub_monthly
          STRIPE_PRICE_ANNUAL: price_stub_annual
          STRIPE_BILLING_PORTAL_RETURN_URL: https://example.com/admin/billing
          BILLING_SWEEP_TOKEN: ci-stub-token
        run: npm run build

  # Build the prod app image and push to GHCR. Runs only on merges to main
  # (or manual dispatch). Gated on test+build passing, UNLESS the commit
  # message contains [fast-ship] (cosmetic changes) or it's a manual dispatch.
  publish:
    name: Build & push image
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    if: >
      always()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'workflow_dispatch')
      && (
        (needs.test.result == 'success' && needs.build.result == 'success')
        || contains(github.event.head_commit.message, '[fast-ship]')
        || github.event_name == 'workflow_dispatch'
      )
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/majidtahir1/open-masjid
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Telegram notification of the pipeline outcome on main (and manual runs).
  # Runs always() so it reports failures too — including a test/build gate
  # failure that skipped publish. No-ops if the TELEGRAM_* secrets are unset.
  notify:
    name: Notify (Telegram)
    needs: [test, build, publish]
    runs-on: ubuntu-latest
    if: >
      always()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'workflow_dispatch')
    steps:
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH: ${{ needs.publish.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          # Passed via env (NOT interpolated into the script) to avoid shell
          # injection from crafted commit messages.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping notification."
            exit 0
          fi
          if [ "$PUBLISH" = "success" ]; then
            STATUS="✅ OpenMasjid · image published to GHCR — deploying shortly"
          elif [ "$TEST" = "failure" ] || [ "$BUILD" = "failure" ]; then
            STATUS="❌ OpenMasjid · CI gate failed (test=$TEST, build=$BUILD) — nothing published"
          elif [ "$PUBLISH" = "failure" ]; then
            STATUS="❌ OpenMasjid · image build/push to GHCR failed"
          else
            STATUS="⚠️ OpenMasjid · pipeline finished (publish=$PUBLISH, test=$TEST, build=$BUILD)"
          fi
          # First line of the commit message (read from env — never interpolated
          # into the script — to avoid injection from crafted commit messages).
          SUBJECT="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          TEXT="$(printf '%s\n\n%s\n%s @ %s · %s · %s\nrun: %s' \
            "$STATUS" "$SUBJECT" "$REPO" "$REF" "${SHA:0:7}" "$ACTOR" "$RUN_URL")"
          # A failed notification must NOT fail the pipeline (the deploy already
          # happened). Capture the API response, surface it as a warning if
          # Telegram rejected it, and always exit 0.
          RESP="$(curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$TEXT" 2>&1)" || true
          echo "Telegram response: $RESP"
          if printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "Notified: $STATUS"
          else
            echo "::warning title=Telegram notification failed::$RESP — check TELEGRAM_CHAT_ID and that you've sent your bot a message (bots can't DM users who haven't started them)."
          fi
