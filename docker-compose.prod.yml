# Production Docker Compose stack for OpenMasjid.
#
#   app   - Next.js + Payload (standalone build, non-root, port 3000 internal)
#   db    - Postgres 16 (persistent pgdata volume)
#   cron  - Alpine crond sidecar that ticks /api/payload-jobs/run every minute
#
# Expected to sit behind an external reverse proxy (Nginx Proxy Manager
# running on a different host on the LAN, in its own compose stack). The app
# publishes port 3000 on the host's LAN interface so NPM can reach it by IP.
#
# Media uploads live in `public/media` inside the container; a host/TrueNAS
# bind mount survives container rebuilds. See README "Deploying with Docker".

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openmasjid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Defaults to :latest (what Watchtower auto-updates). Pin APP_IMAGE to a
    # ghcr.io/majidtahir1/open-masjid:sha-<short> tag to roll back to a specific
    # build — that sha tag is immutable, so Watchtower won't clobber the pin.
    image: ${APP_IMAGE:-ghcr.io/majidtahir1/open-masjid:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    labels:
      # Only this container is auto-updated by Watchtower (label-scoped below).
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      # Marks the container unhealthy if the server isn't accepting requests —
      # e.g. a failed startup migration that never reaches `node server.js`.
      # Host-agnostic: any HTTP response <500 counts as up (redirects/404 are
      # fine). start_period covers migrate + cold boot before failures count.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      # Publish on the LAN so an off-box NPM can proxy to
      # http://<host-ip>:${APP_HOST_PORT}. Use APP_BIND=127.0.0.1 to restrict
      # to localhost only (e.g. when NPM runs on the same machine).
      # APP_HOST_PORT lets you avoid collisions with other services on the
      # host; the container always listens on 3000 internally.
      - "${APP_BIND:-0.0.0.0}:${APP_HOST_PORT:-3000}:3000"
    volumes:
      # Host/TrueNAS mount for uploaded media. Point MEDIA_PATH at a local
      # directory OR an NFS-mounted share. Default: ./media (host).
      - ${MEDIA_PATH:-./media}:/app/public/media

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR auth so Watchtower can pull the private image. Create this on the
      # host with `docker login ghcr.io` using a read:packages PAT (see README).
      - ${DOCKER_CONFIG_PATH:-~/.docker/config.json}:/config.json:ro
    environment:
      # Only watch containers explicitly labelled enable=true (the app).
      WATCHTOWER_LABEL_ENABLE: "true"
      # Poll the registry every 5 minutes.
      WATCHTOWER_POLL_INTERVAL: "300"
      # Remove the old image after a successful update.
      WATCHTOWER_CLEANUP: "true"
      # Telegram notifications for deploy events (image pulled, container
      # recreated, failures). Only active when TELEGRAM_* are set in .env;
      # shoutrrr ignores an empty URL. Get the chat id via @userinfobot or the
      # bot's getUpdates. See README "Deploy notifications".
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS:-}
      WATCHTOWER_NOTIFICATION_URL: ${TELEGRAM_BOT_TOKEN:+telegram://${TELEGRAM_BOT_TOKEN}@telegram?chats=${TELEGRAM_CHAT_ID}}
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
    command: ["--label-enable"]

  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    env_file: ${ENV_FILE:-.env}
    environment:
      TZ: America/Chicago
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null &&
      printf '%s\n%s\n'
      '* * * * * curl -fsS -X POST http://app:3000/api/payload-jobs/run -H \"X-Cron-Secret: $$CRON_SECRET\" >> /proc/1/fd/1 2>&1'
      '0 1 * * * curl -fsS -X POST http://app:3000/api/demo/reset -H \"X-Cron-Secret: $$CRON_SECRET\" >> /proc/1/fd/1 2>&1'
      > /etc/crontabs/root &&
      crond -f -L /dev/stdout"

volumes:
  pgdata:
